# Builds the Cartucho APK around the emulator cores published by the
# "Build cores" workflow (release "cores"), and runs the native tests.
name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push makes an older run of the same branch pointless.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: "29.0.14206865"

jobs:
  host-tests:
    name: Native tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Mesa (offscreen GLES)
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl-dev libgles-dev libegl-mesa0 libgl1-mesa-dri gdb > /dev/null
      - name: Build and run
        run: .github/scripts/logged.sh "native tests" tools/host-test/run.sh

  apk:
    name: APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 15
      - name: Get the emulator cores
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          if ! gh release download cores -p '*.so' -D app/src/main/jniLibs/arm64-v8a; then
            echo "::warning title=No cores yet::Run the 'Build cores' workflow; this APK has no emulators."
          fi
      - name: Cover name lists
        # The names of every box art in the libretro thumbnail collection,
        # packed into the APK so the app matches covers without calling the
        # (rate-limited) GitHub API. Only the file list is fetched, no images.
        run: |
          mkdir -p app/src/main/assets/covers
          for repo in Nintendo_-_Game_Boy Nintendo_-_Game_Boy_Color Nintendo_-_Game_Boy_Advance \
                      Nintendo_-_Nintendo_DS Nintendo_-_Nintendo_3DS \
                      Nintendo_-_Nintendo_Entertainment_System Nintendo_-_Super_Nintendo_Entertainment_System \
                      Sega_-_Mega_Drive_-_Genesis Sega_-_Master_System_-_Mark_III Sega_-_Game_Gear \
                      Sony_-_PlayStation; do
            git clone -q --depth 1 --filter=blob:none --no-checkout \
              "https://github.com/libretro-thumbnails/$repo.git" "thumbs-$repo"
            # -z: names exactly as stored (no quoting of accents or quotes).
            git -C "thumbs-$repo" ls-tree -z --name-only HEAD Named_Boxarts/ | tr '\0' '\n' \
              | sed -n 's|^Named_Boxarts/\(.*\)\.png$|\1|p' > "app/src/main/assets/covers/$repo.txt"
            echo "$repo: $(wc -l < "app/src/main/assets/covers/$repo.txt") names"
          done
      - name: Cheat name lists
        # Names of the ready-made cheat files in the libretro database; the
        # app downloads the one the player picks.
        run: |
          mkdir -p app/src/main/assets/cheats
          git clone -q --depth 1 --filter=blob:none --no-checkout \
            https://github.com/libretro/libretro-database.git lrdb
          for dir in "Nintendo - Game Boy" "Nintendo - Game Boy Color" "Nintendo - Game Boy Advance" \
                     "Nintendo - Nintendo DS" "Nintendo - Nintendo Entertainment System" \
                     "Nintendo - Super Nintendo Entertainment System" "Sega - Mega Drive - Genesis" \
                     "Sega - Master System - Mark III" "Sega - Game Gear" "Sony - PlayStation"; do
            git -C lrdb ls-tree -z --name-only HEAD "cht/$dir/" | tr '\0' '\n' \
              | sed -n 's|^cht/[^/]*/\(.*\)\.cht$|\1|p' > "app/src/main/assets/cheats/$dir.txt"
            echo "$dir: $(wc -l < "app/src/main/assets/cheats/$dir.txt") cheat files"
          done
      - name: Game facts
        # Year, genre, developer, publisher and players from the libretro
        # database's metadat/, packed small (tools/metadata/pack.py).
        run: |
          for f in releaseyear genre developer publisher maxusers; do
            git -C lrdb checkout -q HEAD -- "metadat/$f" || true
          done
          python3 tools/metadata/pack.py lrdb app/src/main/assets/meta
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Install NDK and CMake
        run: echo "y" | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "cmake;3.22.1" > /dev/null
      - name: Build
        env:
          CARTUCHO_NDK_VERSION: ${{ env.NDK_VERSION }}
        run: |
          ls -la app/src/main/jniLibs/arm64-v8a
          .github/scripts/logged.sh "apk build" gradle --no-daemon assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Cartucho-${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Cartucho-apk
          path: dist/*.apk
      - name: Keep unstripped native code (for crash reports)
        run: |
          mkdir -p symbols
          find app/build/intermediates -path '*arm64-v8a*' -name 'libcartucho.so' -size +100k \
            -exec cp {} symbols/ \; -quit || true
          ls -la symbols
      - uses: actions/upload-artifact@v4
        with:
          name: symbols-app
          path: symbols/
          retention-days: 90
      - name: Publish as the "latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The app shows the "- " lines as what is new.
          { echo "APK gerado automaticamente a partir de ${{ github.sha }}."; echo
            git log -10 --no-merges --format='- %s'; } > notes.md
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest dist/*.apk --title "Cartucho build ${{ github.run_number }}" \
            --notes-file notes.md --latest

permissions:
  contents: write
