# Builds the Cartucho APK around the emulator cores published by the
# "Build cores" workflow (release "cores"), and runs the native tests.
name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push makes an older run of the same branch pointless.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: "29.0.14206865"

jobs:
  host-tests:
    name: Native tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Mesa (offscreen GLES)
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl-dev libgles-dev libegl-mesa0 libgl1-mesa-dri gdb > /dev/null
      - name: Build and run
        run: .github/scripts/logged.sh "native tests" tools/host-test/run.sh

  apk:
    name: APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Get the emulator cores
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          if ! gh release download cores -p '*.so' -D app/src/main/jniLibs/arm64-v8a; then
            echo "::warning title=No cores yet::Run the 'Build cores' workflow; this APK has no emulators."
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Install NDK and CMake
        run: echo "y" | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "cmake;3.22.1" > /dev/null
      - name: Build
        env:
          CARTUCHO_NDK_VERSION: ${{ env.NDK_VERSION }}
        run: |
          ls -la app/src/main/jniLibs/arm64-v8a
          .github/scripts/logged.sh "apk build" gradle --no-daemon assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Cartucho-${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Cartucho-apk
          path: dist/*.apk
      - name: Publish as the "latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest dist/*.apk --title "Cartucho build ${{ github.run_number }}" \
            --notes "APK gerado automaticamente a partir de ${{ github.sha }}." --latest

permissions:
  contents: write
