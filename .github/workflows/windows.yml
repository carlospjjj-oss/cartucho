# Cartucho for Windows: the emulator cores built with MSYS2 (MinGW-w64, the
# way libretro builds them), the program cross-compiled from Linux, and a
# zip published as the "pc" release (Cartucho-PC-N.zip).
name: Build Windows

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "app/src/main/cpp/**"
      - "app/src/main/res/drawable-nodpi/**"
      - ".github/workflows/windows.yml"
      - ".github/workflows/cores.yml"
      - ".github/patches/**"
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  versions:
    runs-on: ubuntu-24.04
    outputs:
      vbam: ${{ steps.v.outputs.vbam }}
      melonds: ${{ steps.v.outputs.melonds }}
      azahar: ${{ steps.v.outputs.azahar }}
      fceumm: ${{ steps.v.outputs.fceumm }}
      snes9x: ${{ steps.v.outputs.snes9x }}
      gpgx: ${{ steps.v.outputs.gpgx }}
      pcsx: ${{ steps.v.outputs.pcsx }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        # The same commits as the Android cores (cores.yml).
        run: |
          get() { grep -oP "$1: \K\w+" .github/workflows/cores.yml; }
          echo "vbam=$(get VBAM_SHA)" >> "$GITHUB_OUTPUT"
          echo "melonds=$(get MELONDS_SHA)" >> "$GITHUB_OUTPUT"
          echo "azahar=$(get AZAHAR_SHA)" >> "$GITHUB_OUTPUT"
          echo "fceumm=$(get FCEUMM_SHA)" >> "$GITHUB_OUTPUT"
          echo "snes9x=$(get SNES9X_SHA)" >> "$GITHUB_OUTPUT"
          echo "gpgx=$(get GPGX_SHA)" >> "$GITHUB_OUTPUT"
          echo "pcsx=$(get PCSX_SHA)" >> "$GITHUB_OUTPUT"

  cores:
    name: Core ${{ matrix.lib }} (Windows)
    needs: versions
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lib: vbam, repo: visualboyadvance-m/visualboyadvance-m }
          - { lib: melondsds, repo: JesseTG/melonds-ds }
          - { lib: azahar, repo: azahar-emu/azahar, sys: CLANG64 }
          - { lib: fceumm, repo: libretro/libretro-fceumm }
          - { lib: snes9x, repo: libretro/snes9x }
          - { lib: genesis_plus_gx, repo: libretro/Genesis-Plus-GX }
          - { lib: pcsx_rearmed, repo: libretro/pcsx_rearmed }
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - name: Commit
        id: sha
        shell: bash
        run: |
          case "${{ matrix.lib }}" in
            vbam) s=${{ needs.versions.outputs.vbam }} ;;
            melondsds) s=${{ needs.versions.outputs.melonds }} ;;
            azahar) s=${{ needs.versions.outputs.azahar }} ;;
            fceumm) s=${{ needs.versions.outputs.fceumm }} ;;
            snes9x) s=${{ needs.versions.outputs.snes9x }} ;;
            genesis_plus_gx) s=${{ needs.versions.outputs.gpgx }} ;;
            pcsx_rearmed) s=${{ needs.versions.outputs.pcsx }} ;;
          esac
          echo "sha=$s" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: out
          key: win-${{ matrix.lib }}-${{ steps.sha.outputs.sha }}-${{ hashFiles('.github/patches/vbam-cartucho.patch') }}-v2
      - uses: msys2/setup-msys2@v2
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          msystem: ${{ matrix.sys || 'UCRT64' }}
          update: true
          install: git make
          pacboy: >-
            toolchain:p cmake:p ninja:p zlib:p python:p pkgconf:p nasm:p
      - name: Fetch
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git config --global core.autocrlf false
          git init -q src && cd src
          git remote add origin "https://github.com/${{ matrix.repo }}.git"
          git fetch -q --depth 1 origin "${{ steps.sha.outputs.sha }}" && git checkout -q FETCH_HEAD
          git submodule update --init --recursive --depth 1 -j 8
          if [ "${{ matrix.lib }}" = vbam ]; then tr -d '\r' < ../.github/patches/vbam-cartucho.patch > ../vbam.patch && git apply ../vbam.patch; fi
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -e
          trap 'echo "::error::core build stopped at line $LINENO: $BASH_COMMAND"' ERR
          mkdir -p out
          L=$PWD/.github/scripts/logged.sh
          cd src
          case "${{ matrix.lib }}" in
            vbam)
              $L "vbam configure" cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DENABLE_LIBRETRO=ON -DENABLE_QT=OFF -DENABLE_WX=OFF -DENABLE_SDL=OFF \
                -DBUILD_TESTING=OFF -DENABLE_VULKAN=OFF -DENABLE_LUA=OFF -DENABLE_FFMPEG=OFF \
                -DENABLE_LINK=ON -DENABLE_NLS=OFF -DLIBINTL_INC="$(cygpath -m "$PWD/src/libretro/compat")" \
                -DCMAKE_CXX_STANDARD_LIBRARIES="-lmsvcrt -lws2_32 -lwinmm -lkernel32 -luser32 -ladvapi32" -DCMAKE_SHARED_LINKER_FLAGS="-static -static-libgcc -static-libstdc++" \
                -DCMAKE_MODULE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++" \
                -DZLIB_LIBRARY="$(cygpath -m "$MINGW_PREFIX/lib/libz.a")"
              $L "vbam build" cmake --build build --target vbam_libretro -j 4
              cp "$(find build -name 'vbam_libretro*.dll' | head -1)" ../out/vbam_libretro.dll ;;
            melondsds)
              $L "melonds configure" cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_OPENGL=OFF \
                -DCMAKE_SHARED_LINKER_FLAGS="-static -static-libgcc -static-libstdc++"
              $L "melonds build" cmake --build build --target melondsds_libretro -j 4
              cp "$(find build -name 'melondsds_libretro*.dll' | head -1)" ../out/melondsds_libretro.dll ;;
            azahar)
              # MinGW: the libretro branch uses struct _stat64 but plain fstat.
              sed -i 's/^#elif defined(HAVE_LIBRETRO)$/&\n#define fstat _fstat64/' src/common/file_util.cpp
              # -Bsymbolic is an ELF option; lld for Windows refuses it.
              sed -i 's/target_link_libraries(citra_libretro PRIVATE "-Wl,-Bsymbolic")/# no -Bsymbolic on Windows/' src/citra_libretro/CMakeLists.txt
              [ "$(grep -c "define fstat _fstat64" src/common/file_util.cpp)" -ge 2 ] || { echo "::error::azahar: fstat line not found"; exit 1; }
              $L "azahar configure" env CXXFLAGS="$(for h in cstdlib cstring cstdint cstdio cmath type_traits vector string string_view array algorithm numeric iterator memory utility optional functional limits stdexcept map unordered_map set tuple atomic mutex chrono span bit exception new typeinfo thread condition_variable deque list variant sstream initializer_list; do printf -- '-include %s ' $h; done)" cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_LIBRETRO=ON -DCITRA_USE_PRECOMPILED_HEADERS=OFF \
                -DENABLE_QT=OFF -DENABLE_SDL2=OFF -DENABLE_TESTS=OFF -DENABLE_ROOM=OFF -DENABLE_WEB_SERVICE=OFF \
                -DCMAKE_SHARED_LINKER_FLAGS="-static" \
                -DCMAKE_C_FLAGS="-include $(cygpath -m "$PWD/../.github/patches/endian-compat.h")"
              $L "azahar build" cmake --build build --target azahar_libretro -j 4
              cp "$(find build -name 'azahar_libretro*.dll' | head -1)" ../out/azahar_libretro.dll ;;
            *)
              d=.; [ -f libretro/Makefile ] && [ ! -f Makefile ] && d=libretro
              mk=Makefile
              [ -f $d/Makefile.libretro ] && mk=Makefile.libretro
              LDFLAGS="-static -static-libgcc -static-libstdc++" $L "${{ matrix.lib }} build" make -C $d -f $mk platform=win -j 4
              cp "$(ls $d/*_libretro.dll | head -1)" "../out/${{ matrix.lib }}_libretro.dll" ;;
          esac
          strip -s ../out/*.dll
          # Only Windows' own DLLs may be needed: nothing from MinGW.
          objdump -p ../out/*.dll > ../deps.txt || echo "::warning::objdump status $?"
          grep "DLL Name" ../deps.txt | sed 's/^/::notice::/' || true
          bad=$(grep -ioE "DLL Name: (libwinpthread|libgcc|libstdc|libc\+\+|libunwind|zlib|libz)[^ ]*" ../deps.txt | sort -u | tr '\n' ' ' || true)
          if [ -n "$bad" ]; then echo "::error::the core needs a MinGW DLL: $bad"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: wincore-${{ matrix.lib }}
          path: out/*.dll

  app:
    name: Cartucho.exe
    needs: cores
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 15
      - name: Tools
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -q
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -q g++-mingw-w64-x86-64-posix ninja-build > /dev/null
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          curl -sSL -o sdl.tgz https://github.com/libsdl-org/SDL/releases/download/release-2.30.9/SDL2-devel-2.30.9-mingw.tar.gz
          tar xzf sdl.tgz
      - name: Data lists (covers, cheats, game facts)
        run: .github/scripts/assets.sh desktop/assets
      - name: Build
        run: |
          SDL=$PWD/SDL2-2.30.9/x86_64-w64-mingw32
          cmake -S desktop -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$PWD/desktop/cmake/mingw64.cmake \
            -DSDL2_MINGW_PREFIX=$SDL -DSDL2_DIR=$SDL/lib/cmake/SDL2 \
            -DCARTUCHO_VERSION=1.0.${{ github.run_number }}
          cmake --build build -j "$(nproc)"
      - uses: actions/download-artifact@v4
        with:
          pattern: wincore-*
          path: cores
          merge-multiple: true
      - name: Package
        run: |
          D=Cartucho
          mkdir -p $D/cores
          cp build/cartucho.exe $D/Cartucho.exe
          cp SDL2-2.30.9/x86_64-w64-mingw32/bin/SDL2.dll $D/
          cp -r build/assets $D/assets
          curl -sSL -o $D/assets/gamecontrollerdb.txt \
            https://raw.githubusercontent.com/mdqinc/SDL_GameControllerDB/master/gamecontrollerdb.txt || true
          cp cores/*.dll $D/cores/ 2>/dev/null || echo "::warning::no cores"
          ls -la $D/cores
          cp desktop/LEIA-ME.txt $D/ 2>/dev/null || true
          zip -qr "Cartucho-PC-${{ github.run_number }}.zip" $D
          ls -la *.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Cartucho-PC
          path: Cartucho-PC-*.zip
      - name: Publish as the "pc" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Cartucho para Windows, gerado a partir de ${{ github.sha }}."; echo
            git log -10 --no-merges --format='- %s'; } > notes.md
          gh release delete pc --yes --cleanup-tag 2>/dev/null || true
          if ! out=$(gh release create pc Cartucho-PC-*.zip --title "Cartucho para PC (build ${{ github.run_number }})" \
              --notes-file notes.md --prerelease 2>&1); then
            echo "$out"
            echo "::error title=Release::$(echo "$out" | tail -4 | tr '\n' ' ')"
            exit 1
          fi
