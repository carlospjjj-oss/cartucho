# Builds the two emulator cores from their upstream sources with the Android
# NDK and publishes them as the "cores" release, which the APK build
# downloads. Run it by hand (Actions > Build cores > Run workflow) after
# bumping an emulator version below. Cached by upstream commit, so a rerun
# without a version change takes seconds.
name: Build cores

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  NDK_VERSION: "29.0.14206865"
  # Upstream commits the cores are built from. Bump to update an emulator.
  VBAM_REPO: visualboyadvance-m/visualboyadvance-m
  VBAM_SHA: 07fb482d07b919b48fd63f8ac66546605ebf5afd
  MELONDS_REPO: JesseTG/melonds-ds
  MELONDS_SHA: f394adbacb5722ee97c1b37c8064da9a25818310
  AZAHAR_REPO: azahar-emu/azahar
  AZAHAR_SHA: 1edf59ef592a854ccc2a7405d9aade477b2a0b3d
  # Classic consoles (built with ndk-build from each core's own jni/ folder).
  FCEUMM_SHA: ac0d00a7fc01166f84c7bac01d1084ebfd2b865e
  SNES9X_SHA: fae2fea08f74180759ef540ee94259213f503480
  GPGX_SHA: 60bee4c724859710ce05672239e5b601ad01382e
  PCSX_SHA: 050995286239a066f7cfaf74900350b697161a80

jobs:
  core-gba:
    name: Core GBA (VBA-M)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache
        with:
          path: |
            out/libvbam_libretro.so
            symbols/libvbam_libretro.so
          key: vbam-android-arm64-sym-${{ env.VBAM_SHA }}-${{ hashFiles('.github/patches/vbam-cartucho.patch') }}
      - name: Install NDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: echo "y" | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
      - name: Fetch VBA-M
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git init -q vbam && cd vbam
          git remote add origin "https://github.com/$VBAM_REPO.git"
          git fetch -q --depth 1 origin "$VBAM_SHA" && git checkout -q FETCH_HEAD
          git apply ../.github/patches/vbam-cartucho.patch
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          L=.github/scripts/logged.sh
          $L "vbam configure" cmake -S vbam -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_LIBRETRO=ON -DENABLE_QT=OFF -DENABLE_WX=OFF -DENABLE_SDL=OFF \
            -DBUILD_TESTING=OFF -DENABLE_VULKAN=OFF -DENABLE_LUA=OFF -DENABLE_FFMPEG=OFF \
            -DENABLE_LINK=ON -DENABLE_NLS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          $L "vbam build" cmake --build build --target vbam_libretro -j "$(nproc)"
          mkdir -p out
          cp "$(find build -name 'vbam_libretro*.so' | head -1)" out/libvbam_libretro.so
          # Unstripped copy, to turn crash reports (library + offset) into function names.
          mkdir -p symbols && cp out/libvbam_libretro.so symbols/
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" -s out/libvbam_libretro.so
      - uses: actions/upload-artifact@v4
        with:
          name: core-gba
          path: out/libvbam_libretro.so
      - uses: actions/upload-artifact@v4
        with:
          name: symbols-gba
          path: symbols/libvbam_libretro.so
          retention-days: 90

  core-nds:
    name: Core DS (melonDS DS)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache
        with:
          path: out/libmelondsds_libretro.so
          key: melondsds-android-arm64-${{ env.MELONDS_SHA }}-v1
      - name: Install NDK and CMake
        if: steps.cache.outputs.cache-hit != 'true'
        run: echo "y" | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "cmake;3.30.3" > /dev/null
      - name: Fetch melonDS DS
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git init -q melonds && cd melonds
          git remote add origin "https://github.com/$MELONDS_REPO.git"
          git fetch -q --depth 1 origin "$MELONDS_SHA" && git checkout -q FETCH_HEAD
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          CMAKE="$ANDROID_SDK_ROOT/cmake/3.30.3/bin/cmake"
          L=$PWD/.github/scripts/logged.sh
          # Software renderer (melonDS has no OpenGL ES renderer); the ARM64
          # JIT is on by default.
          $L "melonds configure" "$CMAKE" -S melonds -B build-nds -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release -DENABLE_OPENGL=OFF \
            -DCMAKE_MAKE_PROGRAM="$(command -v ninja)"
          $L "melonds build" "$CMAKE" --build build-nds --target melondsds_libretro -j "$(nproc)"
          mkdir -p out
          cp "$(find build-nds -name 'melondsds_libretro*.so' | head -1)" out/libmelondsds_libretro.so
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" -s out/libmelondsds_libretro.so
      - uses: actions/upload-artifact@v4
        with:
          name: core-nds
          path: out/libmelondsds_libretro.so

  core-3ds:
    name: Core 3DS (Azahar)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache
        with:
          path: out/libazahar_libretro.so
          key: azahar-android-arm64-${{ env.AZAHAR_SHA }}-v1
      - name: Install NDK and CMake
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          echo "y" | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "cmake;3.30.3" > /dev/null
      - name: Fetch Azahar
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git init -q azahar && cd azahar
          git remote add origin "https://github.com/$AZAHAR_REPO.git"
          git fetch -q --depth 1 origin "$AZAHAR_SHA" && git checkout -q FETCH_HEAD
          git submodule update --init --recursive --depth 1 -j 8
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          CMAKE="$ANDROID_SDK_ROOT/cmake/3.30.3/bin/cmake"
          L=$PWD/.github/scripts/logged.sh
          cd azahar
          # API 21 like upstream's own libretro CI: bionic only declares the
          # GNU strerror_r from API 23, which the core's error.cpp rejects.
          $L "azahar configure" "$CMAKE" -DENABLE_LIBRETRO=ON -DANDROID_PLATFORM=android-21 \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_STL=c++_static -DANDROID_ABI=arm64-v8a -DCMAKE_BUILD_TYPE=Release \
            . -B build
          $L "azahar build" "$CMAKE" --build build --target azahar_libretro --config Release -j "$(nproc)"
          mkdir -p ../out
          cp "$(find build -name 'azahar_libretro*.so' | head -1)" ../out/libazahar_libretro.so
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" -s ../out/libazahar_libretro.so
      - uses: actions/upload-artifact@v4
        with:
          name: core-3ds
          path: out/libazahar_libretro.so

  core-classic:
    name: Core ${{ matrix.title }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - title: NES (FCEUmm)
            lib: fceumm
            repo: libretro/libretro-fceumm
            sha_var: FCEUMM_SHA
            jni: jni
          - title: SNES (Snes9x)
            lib: snes9x
            repo: libretro/snes9x
            sha_var: SNES9X_SHA
            jni: libretro/jni
          - title: Mega Drive / Master System / Game Gear (Genesis Plus GX)
            lib: genesis_plus_gx
            repo: libretro/Genesis-Plus-GX
            sha_var: GPGX_SHA
            jni: libretro/jni
          - title: PlayStation (PCSX ReARMed)
            lib: pcsx_rearmed
            repo: libretro/pcsx_rearmed
            sha_var: PCSX_SHA
            jni: jni
    steps:
      - uses: actions/checkout@v4
      - name: Commit
        id: sha
        run: echo "sha=${{ env[matrix.sha_var] }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: out/lib${{ matrix.lib }}_libretro.so
          key: ${{ matrix.lib }}-android-arm64-${{ steps.sha.outputs.sha }}-v1
      - name: Install NDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: echo "y" | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
      - name: Fetch
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git init -q src && cd src
          git remote add origin "https://github.com/${{ matrix.repo }}.git"
          git fetch -q --depth 1 origin "${{ steps.sha.outputs.sha }}" && git checkout -q FETCH_HEAD
          git submodule update --init --recursive --depth 1 -j 8
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          L=$PWD/.github/scripts/logged.sh
          cd "src/${{ matrix.jni }}"
          $L "${{ matrix.lib }} build" "$NDK/ndk-build" -j "$(nproc)" APP_ABI=arm64-v8a APP_PLATFORM=android-24
          cd - > /dev/null
          mkdir -p out
          so="$(find src -path '*libs/arm64-v8a/*.so' | head -1)"
          echo "built: $so"
          cp "$so" "out/lib${{ matrix.lib }}_libretro.so"
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" -s "out/lib${{ matrix.lib }}_libretro.so"
      - uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.lib }}
          path: out/lib${{ matrix.lib }}_libretro.so

  publish:
    name: Publish cores
    needs: [core-gba, core-nds, core-3ds, core-classic]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: core-*
          path: cores
          merge-multiple: true
      - name: Upload to the "cores" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la cores
          printf 'VBA-M %s\nmelonDS DS %s\nAzahar %s\nFCEUmm %s\nSnes9x %s\nGenesis Plus GX %s\nPCSX ReARMed %s\n' \
            "$VBAM_SHA" "$MELONDS_SHA" "$AZAHAR_SHA" "$FCEUMM_SHA" "$SNES9X_SHA" "$GPGX_SHA" "$PCSX_SHA" > cores/VERSIONS.txt
          gh release view cores > /dev/null 2>&1 || \
            gh release create cores --title "Emulator cores" --prerelease \
              --notes "Cores usados pelo APK. Gerados pelo workflow Build cores."
          gh release upload cores cores/* --clobber
