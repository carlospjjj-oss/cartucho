# Installs the latest APK on an Android emulator, fills the library with
# freely distributable test ROMs and takes screenshots of the main screens
# (console look and grid, landscape and portrait, a game running). Run it by
# hand; the pictures come out as the "screens" artifact.
name: Screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  NDK_VERSION: "29.0.14206865"

jobs:
  # The release APK only runs on ARM phones. The CI emulator is x86_64, so
  # this builds an APK that also carries x86_64 code and the NES and Sega
  # cores for it, to see games actually running.
  x86:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Core commits
        id: sha
        run: |
          echo "fceumm=$(grep -oP 'FCEUMM_SHA: \K\w+' .github/workflows/cores.yml)" >> "$GITHUB_OUTPUT"
          echo "gpgx=$(grep -oP 'GPGX_SHA: \K\w+' .github/workflows/cores.yml)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: x86cores
          key: x86cores-${{ steps.sha.outputs.fceumm }}-${{ steps.sha.outputs.gpgx }}-v1
      - name: Install NDK and CMake
        run: echo "y" | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "cmake;3.22.1" > /dev/null
      - name: x86_64 cores
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          mkdir -p x86cores
          build() {  # lib repo sha jni
            git init -q "s-$1" && git -C "s-$1" remote add origin "https://github.com/$2.git"
            git -C "s-$1" fetch -q --depth 1 origin "$3" && git -C "s-$1" checkout -q FETCH_HEAD
            (cd "s-$1/$4" && "$NDK/ndk-build" -j "$(nproc)" APP_ABI=x86_64 APP_PLATFORM=android-24 > /dev/null)
            cp "$(find "s-$1" -path '*libs/x86_64/*.so' | head -1)" "x86cores/lib$1_libretro.so"
          }
          build fceumm libretro/libretro-fceumm ${{ steps.sha.outputs.fceumm }} jni
          build genesis_plus_gx libretro/Genesis-Plus-GX ${{ steps.sha.outputs.gpgx }} libretro/jni
          ls -la x86cores
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Signing key
        env:
          KEY_B64: ${{ secrets.CARTUCHO_KEYSTORE_B64 }}
        run: |
          # The key lives in a repository secret, never in the code.
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/cartucho.keystore"
            echo "CARTUCHO_KEYSTORE=$RUNNER_TEMP/cartucho.keystore" >> "$GITHUB_ENV"
            echo "CARTUCHO_KEYSTORE_PASSWORD=cartucho" >> "$GITHUB_ENV"
          else
            echo "::warning title=No signing key::Add the CARTUCHO_KEYSTORE_B64 secret; this APK will not update the installed one."
          fi
      - name: Build the APK with x86_64
        env:
          CARTUCHO_NDK_VERSION: ${{ env.NDK_VERSION }}
        run: |
          mkdir -p app/src/main/jniLibs/x86_64
          cp x86cores/*.so app/src/main/jniLibs/x86_64/
          gradle --no-daemon -q assembleRelease -PextraAbi=x86_64
          cp app/build/outputs/apk/release/app-release.apk app.apk
      - uses: actions/upload-artifact@v4
        with:
          name: x86-apk
          path: app.apk

  screens:
    needs: x86
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: x86-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Latest APK and test ROMs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p roms/GB roms/NES roms/SNES roms/SMS roms/PS1
          git clone -q --depth 1 https://github.com/retrio/gb-test-roms.git t-gb
          git clone -q --depth 1 https://github.com/christopherpow/nes-test-roms.git t-nes
          git clone -q --depth 1 https://github.com/PeterLemon/SNES.git t-snes
          git clone -q --depth 1 https://github.com/PeterLemon/SMS.git t-sms
          cp t-gb/cpu_instrs/cpu_instrs.gb "roms/GB/CPU Instrs (Test).gb"
          cp t-gb/instr_timing/instr_timing.gb "roms/GB/Instr Timing (Test).gb"
          cp t-gb/mem_timing/mem_timing.gb "roms/GB/Mem Timing (Test).gb"
          cp t-nes/blargg_nes_cpu_test5/official.nes "roms/NES/CPU Test (Test).nes"
          cp t-snes/PPU/Mode7/RotZoom/RotZoom.sfc "roms/SNES/Mode 7 RotZoom (Demo).sfc"
          cp t-snes/PPU/Mode7/Perspective/Perspective.sfc "roms/SNES/Mode 7 Perspective (Demo).sfc"
          cp t-sms/VDP/HelloWorld/HelloWorld.sms "roms/SMS/Hello World (Demo).sms"
          cp tools/host-test/roms/disc.cue tools/host-test/roms/disc.bin roms/PS1/
          find roms -type f | sort
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/screens.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: shots/
      - name: Publish as the "screens" release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete screens --yes --cleanup-tag 2>/dev/null || true
          gh release create screens shots/* --prerelease --title "Screenshots" \
            --notes "Telas do app no emulador (workflow Screenshots)."
